name: CI & Release

on:
  push:
    branches:
      - android
  pull_request:
    branches:
      - android
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-android:
    name: Test & Build Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Configure release signing (when secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Release keystore configured."
          else
            echo "Signing secrets not configured; falling back to debug signing."
          fi

      - name: Build release split APKs (ARM64 & ARMv7)
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm \
            --dart-define=RELEASE_TAG="$RELEASE_TAG" \
            --dart-define=BUILD_DATE="$BUILD_DATE"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release bundle
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          flutter build linux --release \
            --dart-define=RELEASE_TAG="$RELEASE_TAG" \
            --dart-define=BUILD_DATE="$BUILD_DATE"

      - name: Package AppImage
        run: |
          curl -fsSL -o /tmp/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool-x86_64.AppImage
          curl -fsSL -o /tmp/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64

          rm -rf /tmp/ArxivPocket.AppDir
          mkdir -p /tmp/ArxivPocket.AppDir/usr/bin
          cp -a build/linux/x64/release/bundle/* /tmp/ArxivPocket.AppDir/usr/bin/
          cp assets/icon/icon.png /tmp/ArxivPocket.AppDir/arxivpocket.png
          cp assets/icon/icon.png /tmp/ArxivPocket.AppDir/.DirIcon

          cat <<'EOF' > /tmp/ArxivPocket.AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/arxiv" "$@"
          EOF
          chmod +x /tmp/ArxivPocket.AppDir/AppRun

          cat <<'EOF' > /tmp/ArxivPocket.AppDir/arxivpocket.desktop
          [Desktop Entry]
          Type=Application
          Name=ArxivPocket
          Comment=Browse and read arXiv papers
          Exec=arxiv
          Icon=arxivpocket
          Categories=Science;
          Terminal=false
          EOF

          ARCH=x86_64 /tmp/appimagetool-x86_64.AppImage \
            --appimage-extract-and-run \
            --runtime-file /tmp/runtime-x86_64 \
            /tmp/ArxivPocket.AppDir \
            build/linux/x64/release/ArxivPocket-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/linux/x64/release/ArxivPocket-x86_64.AppImage

      - name: Upload AppImage to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/linux/x64/release/ArxivPocket-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS ARM64 release app
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          flutter build macos --release \
            --dart-define=RELEASE_TAG="$RELEASE_TAG" \
            --dart-define=BUILD_DATE="$BUILD_DATE"

      - name: Package macOS DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build/macos/Build/Products/Release"
            exit 1
          fi
          rm -rf /tmp/ArxivPocketDmg
          mkdir -p /tmp/ArxivPocketDmg
          cp -R "$APP_PATH" "/tmp/ArxivPocketDmg/ArxivPocket.app"
          ln -s /Applications /tmp/ArxivPocketDmg/Applications
          hdiutil create -volname "ArxivPocket" \
            -srcfolder /tmp/ArxivPocketDmg \
            -ov -format UDZO \
            build/macos/Build/Products/Release/ArxivPocket-macos-arm64.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: build/macos/Build/Products/Release/ArxivPocket-macos-arm64.dmg

      - name: Upload macOS DMG to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/Build/Products/Release/ArxivPocket-macos-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
